<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>武汉市交通地图</title>
    <style>
        #map-container { width: 100%; height: 600px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>武汉市交通地图</h1>
    <div id="map-container"></div>
    <script>
        async function loadMap() {
            const container = document.getElementById('map-container');
            try {
                const response = await fetch('http://localhost:8000/generate_map', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ map_type: '交通图', region: '武汉市' })
                });
                const data = await response.json();
                if (data.map_html) {
                    // 使用 Blob URL 嵌入地图 HTML，避免编码问题
                    const blob = new Blob([data.map_html], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    container.innerHTML = ''; // 清空容器
                    const iframe = document.createElement('iframe');
                    iframe.src = url;
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    container.appendChild(iframe);
                } else {
                    container.innerText = '地图数据为空';
                    console.error('map_html 为空', data);
                }
            } catch (err) {
                container.innerText = '加载失败：' + err.message;
                console.error('请求失败:', err);
            }
        }
        loadMap();
    </script>
</body>
</html>
